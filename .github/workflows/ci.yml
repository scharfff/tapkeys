name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the older run of the same PR.
# Runs on main are never cancelled, so every commit on main keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint is pinned by version and by the sha256 of the release archive.
      # It also runs shellcheck over every run: block in the workflows.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: actionlint (workflows)
        run: |
          "$RUNNER_TEMP/actionlint" -color
      - name: shellcheck (build and packaging scripts)
        run: shellcheck -x build.sh scripts/*.sh

  build:
    name: Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is retired (2 November 2026), macos-13 earlier; macos-latest is not used on purpose,
        # so a runner upgrade never changes the toolchain unnoticed. The app targets macOS 13.0:
        # the deployment target is checked in the smoke test, not by running macOS 13.
        # One required runner: macos-15-intel, also the release runner (release.yml uses the same label).
        # macOS 15 with Xcode 16.4; the x86_64 slice runs natively, the DMG and zip are uploaded.
        # The universal binary is built here with both slices, but the arm64 slice is only checked
        # with lipo, vtool and codesign. Running it natively is the job of arm64.yml (informational).
        # Apple Silicon is not in this matrix on purpose: on 2 November 2026 GitHub gave no hosted arm64
        # runner at all (macos-15 and macos-26, "capacity constraints", cancelled after 15 minutes), and a
        # cancelled job keeps this workflow red, which release.yml reads. Do not add arm64 runners here.
        # Intel macOS runners are expected to end in fall 2027 (see actions/runner-images): the release
        # runner then has to move to Apple Silicon, and the SDK of the shipped binary changes with it.
        runner: [macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcode-select -p
          swift --version
      - name: Build universal app
        run: ./build.sh
      - name: Self-test
        run: ./build/TapKeys.app/Contents/MacOS/TapKeys --selftest
      # Same script as in the release workflow. CI sets CI=true, the window layout comes
      # from the recorded template scripts/dmg_layout.DS_Store and Finder is not used.
      - name: Package (zip, DMG, SHA256SUMS)
        env:
          DMG_LAYOUT: template
        run: ./scripts/package.sh
      - name: Smoke test of the packages
        run: ./scripts/smoke_test.sh build
      - name: Job summary
        if: matrix.runner == 'macos-15-intel'
        run: |
          {
            echo "### Packages from this run"
            echo "Download them from the Artifacts section of this run page for a manual test."
            echo '```'
            cat build/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload packages for manual testing
        if: matrix.runner == 'macos-15-intel'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TapKeys-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/TapKeys-v*.zip
            build/TapKeys-*.dmg
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # One stable name for branch protection: the matrix above can change, this check stays.
  result:
    name: CI result
    if: always()
    needs: [lint, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all jobs to succeed
        env:
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "lint: $LINT, build: $BUILD"
          [[ "$LINT" == success && "$BUILD" == success ]]
